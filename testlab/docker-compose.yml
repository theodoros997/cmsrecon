# Deliberately outdated and misconfigured WordPress for testing cmsrecon.
# It is published on 127.0.0.1 only. Never expose it to a network.
name: cmsrecon-lab

x-db-env: &db-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress

services:
  db:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  wordpress:
    image: wordpress:5.8.1-php7.4-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    environment:
      <<: *db-env
      # WORDPRESS_DEBUG defines WP_DEBUG; defining it again in CONFIG_EXTRA
      # makes wp-config.php print a notice that scanners misread as source.
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - site:/var/www/html
      - ./php-lab.ini:/usr/local/etc/php/conf.d/zz-lab.ini:ro

  # One-shot: installs WordPress, users, old plugins and the planted files
  # listed in EXPECTED.md, then exits.
  seed:
    image: wordpress:cli-2.5-php7.4
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      <<: *db-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - site:/var/www/html
      - ./seed.sh:/seed.sh:ro
    entrypoint: ["sh", "/seed.sh"]
    restart: "no"

volumes:
  db:
  site:
